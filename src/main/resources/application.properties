spring.application.name=cursos

# H2
spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:cursodb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Logs
logging.level.org.springframework.web=INFO
logging.level.com.example.cursos=DEBUG

# AWS
spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_KEY}
spring.cloud.aws.region.static=us-east-2

# SQS
sqs.queue.user-deletion=user-deletion-queue

# JWT
jwt.secret=${JWT_SECRET}
aws.accessKeyId=${AWS_ACCESS_KEY}
aws.secretKey=${AWS_SECRET_KEY}
aws.region=us-east-2
aws.s3.bucket=trabalho-pos-avatares

logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=DEBUG